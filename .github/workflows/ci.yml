name: CI Python

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Preparer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Executer les tests
        run: python test_students.py -v
